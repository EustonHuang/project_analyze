<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Trace Viewer</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
  <header>
    <select id="traceSelect"><option>加载中...</option></select>
    <label><input type="checkbox" id="showDecisions" /> 只看决策</label>
    <label><input type="checkbox" id="showSources" checked /> 显示来源路径</label>
    <input id="search" placeholder="搜索节点..." />
    <button id="reload">刷新</button>
  </header>
  <main>
    <section id="treePanel">
      <div id="leftTabs">
        <button id="tabTree" class="tab-btn active">步骤</button>
        <button id="tabGraph" class="tab-btn">流程图</button>
      </div>
      <div id="treeView">
        <div id="tree"></div>
      </div>
      <div id="graphView" class="hidden">
        <div id="graphToolbar">
          <button id="graphZoomIn" title="放大">+</button>
          <button id="graphZoomOut" title="缩小">-</button>
          <button id="graphFit" title="适应窗口">⟲ 适应</button>
        </div>
        <div id="cy"></div>
      </div>
    </section>
    <div class="resizer" id="resizerLeft"></div>
    <section id="sourcePanel">
      <h3>来源详情</h3>
      <div id="sourceBody">在左侧选择一个节点，查看它的来源与引用。</div>
    </section>
    <div class="resizer" id="resizerRight"></div>
    <section id="filePanel">
      <div id="fileHead">
        <span id="fileTitle">文件查看器</span>
        <span id="fileToggle" class="hidden">
          <button id="mdRaw" class="md-btn active">Raw</button>
          <button id="mdRendered" class="md-btn">Rendered</button>
        </span>
      </div>
      <div id="fileBody">选中节点后在此显示整个来源文件。</div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
