<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Trace Viewer</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
</head>
<body>
  <header>
    <select id="traceSelect"><option>加载中...</option></select>
    <label>depth <input type="range" id="depth" min="1" max="6" value="6" /><span id="depthVal">6</span></label>
    <label><input type="checkbox" id="showDecisions" /> 只看决策(菱形)</label>
    <label><input type="checkbox" id="showSources" /> 显示来源</label>
    <input id="search" placeholder="搜索..." />
    <button id="reload">刷新</button>
  </header>
  <main>
    <section id="treePanel"><div id="tree"></div></section>
    <section id="graphPanel"><div id="cy"></div></section>
    <aside id="detail"><h3>详情</h3><div id="detailBody">点节点查看</div></aside>
  </main>
  <script src="app.js"></script>
</body>
</html>
